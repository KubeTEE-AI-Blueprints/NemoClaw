{{- $secretValues := get .Values "secret" | default dict }}
{{- $extraSecretData := get $secretValues "extraStringData" | default dict }}
{{- $existingManagedSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-nvidia" (include "nemoclaw.fullname" .)) }}
{{- $existingManagedSecretData := get $existingManagedSecret "data" | default dict }}
{{- $gatewayToken := get $existingManagedSecretData "openclaw-gateway-token" | default "" }}
{{- if $gatewayToken }}
{{- $gatewayToken = $gatewayToken | b64dec }}
{{- else }}
{{- $gatewayToken = randAlphaNum 64 }}
{{- end }}
{{- if and (not .Values.existingSecret) (or .Values.nvidiaApiKey (gt (len $extraSecretData) 0)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemoclaw.fullname" . }}-nvidia
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  openclaw-gateway-token: {{ $gatewayToken | quote }}
  {{- $k := .Values.existingSecretKey | default "nvidia-api-key" }}
  {{- if .Values.nvidiaApiKey }}
  {{ $k }}: {{ .Values.nvidiaApiKey | quote }}
  {{- end }}
  {{- range $extraKey, $extraValue := $extraSecretData }}
  {{- if ne $extraKey "openclaw-gateway-token" }}
  {{ $extraKey }}: {{ $extraValue | quote }}
  {{- end }}
  {{- end }}
{{- end }}
